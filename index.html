<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ella Training Ultimate</title>

    <meta name="theme-color" content="#1f4e79">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>💪 Ella Training Ultimate</h1>
</header>

<main>

    <section class="card">
        <h2>Heute</h2>

        <p>
            Tag:
            <strong id="todayDay"></strong>
        </p>

        <p>
            Training:
            <strong id="todayTraining"></strong>
        </p>

        <div class="stats">
            <div class="stat">
                ⭐ Punkte:
                <span id="points">0</span>
            </div>

            <div class="stat">
                🔥 Serie:
                <span id="streak">0</span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="progressLabel">0%</div>
        </div>
    </section>

    <section class="card">
        <h2>🏋️ Heutiges Training</h2>
        <div id="exerciseContainer"></div>
    </section>

    <section class="card">
        <h2>🦵 Knie-Routine</h2>
        <div id="kneeContainer"></div>
    </section>

    <section class="card">
        <button onclick="completeTraining()">
            🏁 Training abschließen
        </button>
    </section>

    <section class="card">
        <h2>📈 Trainingshistorie</h2>
        <div id="historyContainer"></div>
    </section>

</main>

.js"></script>

</body>
</html>
